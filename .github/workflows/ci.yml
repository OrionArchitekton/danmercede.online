# CI gate (Spec 4b D4). No secrets. Runs the test suite, the inbox-drift gate
# (Spec 4b D5), and the exact production build path: with VERCEL=1 the prebuild
# compile skips via the D1 guard and vite builds the committed bundle.
#
# Action versions stay at v4 — bumps are deferred to a separate housekeeping PR
# (Spec 4b D6).
name: CI

on: pull_request

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Inbox-drift gate (Spec 4b D5)
        run: npm run drift-check
        env:
          TZ: America/Los_Angeles

      - name: Production build path (prebuild skips via D1 guard)
        run: npm run build
        env:
          VERCEL: "1"

      # Round-2 R9 — assert the BUILT/served DOM body, not just the emitter string.
      # The bodyBake test (tests/bodyBake.test.ts) asserts the emitter/template; it
      # would still pass if a build-config change stopped the bake from landing in
      # the served index.html (the passing-test-masks-prod-bug class — the exact
      # failure that let an empty served <body> ship green). vite's build.outDir is
      # the default `dist/` (no override in vite.config.ts), so the baked feed lands
      # in dist/index.html. Fail closed if the built body lost its <h1> or <p>.
      - name: Assert built DOM body (round-2 R9)
        run: |
          set -euo pipefail
          BUILT="dist/index.html"
          if [ ! -f "$BUILT" ]; then
            echo "R9 FAIL: built file $BUILT not found (build.outDir changed?)" >&2
            exit 1
          fi
          h1=$(grep -o '<h1[ >]' "$BUILT" | wc -l | tr -d ' ')
          p=$(grep -o '<p[ >]' "$BUILT" | wc -l | tr -d ' ')
          echo "R9 built-DOM body counts for $BUILT: h1=$h1 p=$p"
          if [ "$h1" -lt 1 ] || [ "$p" -lt 1 ]; then
            echo "R9 FAIL: served body is blank — expected h1>=1 and p>=1, got h1=$h1 p=$p" >&2
            exit 1
          fi
          echo "R9 OK: served body carries real crawlable content (h1=$h1 p=$p)"
