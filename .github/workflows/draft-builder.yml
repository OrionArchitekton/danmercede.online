name: Draft Builder

on:
  workflow_dispatch:
    inputs:
      raw_file:
        description: 'Specific raw file to process (optional, processes newest if empty)'
        required: false
        type: string
  schedule:
    # Weekly: Mondays at 8:10 AM PT (15:10 UTC during PST, 16:10 UTC during PDT)
    - cron: '10 16 * * 1'

env:
  SLACK_CHANNEL_ID: ${{ secrets.DANMERCEDE_CHANNEL_ID }}
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  CONDUCTOR_URL: ${{ secrets.CONDUCTOR_URL }}

jobs:
  build-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Find newest raw file
        id: find-raw
        run: |
          if [ -n "${{ inputs.raw_file }}" ]; then
            RAW_FILE="${{ inputs.raw_file }}"
            if [ ! -f "raw/$RAW_FILE" ]; then
              echo "::error::Specified file raw/$RAW_FILE does not exist"
              exit 1
            fi
          else
            # Find newest file in /raw/ (excluding .gitkeep)
            RAW_FILE=$(ls -t raw/*.{txt,md} 2>/dev/null | head -1 | xargs basename 2>/dev/null || echo "")
          fi
          
          if [ -z "$RAW_FILE" ] || [ "$RAW_FILE" = ".gitkeep" ]; then
            echo "::notice::No new raw files found in /raw/"
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "raw_file=$RAW_FILE" >> $GITHUB_OUTPUT
          echo "found=true" >> $GITHUB_OUTPUT
          echo "Found raw file: $RAW_FILE"
      
      - name: Read raw content
        if: steps.find-raw.outputs.found == 'true'
        id: read-raw
        run: |
          RAW_FILE="raw/${{ steps.find-raw.outputs.raw_file }}"
          RAW_CONTENT=$(cat "$RAW_FILE")
          
          # Extract date from filename (YYYY-MM-DD--title.txt)
          FILENAME="${{ steps.find-raw.outputs.raw_file }}"
          DATE_PART=$(echo "$FILENAME" | grep -oP '^\d{4}-\d{2}-\d{2}' || echo "")
          
          if [ -z "$DATE_PART" ]; then
            DATE_PART=$(date +%Y-%m-%d)
          fi
          
          # Get current time in PT
          TIMESTAMP="${DATE_PART}T08:10:00-08:00"
          
          echo "date=$DATE_PART" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          
          # Save content to file for multiline handling
          echo "$RAW_CONTENT" > /tmp/raw_content.txt
      
      - name: Call Cosmocrat Conductor
        if: steps.find-raw.outputs.found == 'true'
        id: conductor
        run: |
          RAW_CONTENT=$(cat /tmp/raw_content.txt)
          DATE="${{ steps.read-raw.outputs.date }}"
          TIMESTAMP="${{ steps.read-raw.outputs.timestamp }}"
          
          # Build conductor payload
          PAYLOAD=$(jq -n \
            --arg raw "$RAW_CONTENT" \
            --arg date "$TIMESTAMP" \
            --argjson tags '["governance", "systems", "infra", "execution", "signal", "failure-modes"]' \
            --argjson focus '["governance", "systems", "execution"]' \
            '{
              raw_note: $raw,
              date: $date,
              allowed_tags: $tags,
              current_focus: $focus,
              contract: "publishing-prompt-v1"
            }')
          
          # Call conductor (or use fallback for now)
          if [ -n "$CONDUCTOR_URL" ]; then
            RESPONSE=$(curl -s -X POST "$CONDUCTOR_URL/api/publish" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              --max-time 60)
            
            # Check for REJECTED
            if echo "$RESPONSE" | grep -q "REJECTED"; then
              echo "::error::Conductor rejected the content"
              echo "rejected=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            echo "$RESPONSE" > /tmp/conductor_output.md
          else
            # Fallback: Create basic markdown from raw content
            TITLE=$(echo "$RAW_CONTENT" | head -1 | sed 's/^#\s*//')
            SLUG="${DATE}-$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | head -c 50)"
            # Get first non-empty line after the title as the claim
            CLAIM=$(echo "$RAW_CONTENT" | tail -n +2 | grep -v '^$' | head -1 | head -c 200)
            
            # Build markdown file using printf to avoid heredoc issues
            {
              echo "---"
              echo "slug: \"$SLUG\""
              echo "title: \"$TITLE\""
              echo "date: \"$TIMESTAMP\""
              echo "type: \"short-essay\""
              echo "context: \"governance\""
              echo "tags: [\"governance\", \"systems\"]"
              echo "claim: \"$CLAIM\""
              echo "implication: \"Further exploration needed.\""
              echo "---"
            } > /tmp/conductor_output.md
            
            echo "slug=$SLUG" >> $GITHUB_OUTPUT
          fi
          
          echo "rejected=false" >> $GITHUB_OUTPUT
      
      - name: Parse conductor output
        if: steps.find-raw.outputs.found == 'true' && steps.conductor.outputs.rejected != 'true'
        id: parse
        run: |
          # Extract slug from frontmatter
          SLUG=$(grep -oP '^slug:\s*"\K[^"]+' /tmp/conductor_output.md || echo "")
          TITLE=$(grep -oP '^title:\s*"\K[^"]+' /tmp/conductor_output.md || echo "Draft Post")
          TYPE=$(grep -oP '^type:\s*"\K[^"]+' /tmp/conductor_output.md || echo "short-essay")
          
          if [ -z "$SLUG" ]; then
            DATE="${{ steps.read-raw.outputs.date }}"
            SLUG="${DATE}-draft-$(date +%s)"
          fi
          
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "type=$TYPE" >> $GITHUB_OUTPUT
          
          # Copy to inbox
          cp /tmp/conductor_output.md "inbox/${SLUG}.md"
      
      - name: Checkout dan-mercede-substrate
        # FAIL-LOUD (Spec 4b D9): the live site serves the committed bundle —
        # Vercel never recompiles (Spec 4b D1, PR #20) — so production no longer
        # depends on this workflow. A substrate checkout failure (revoked deploy
        # key, repo moved, network error) must fail this run visibly instead of
        # fail-opening into an inbox-only compile that would open a PR regressing
        # the committed bundle. The previous continue-on-error posture is retired.
        # Runs on every invocation (Spec 4b D3): substrate drift propagates even
        # when no raw draft exists.
        uses: actions/checkout@v4
        with:
          repository: OrionArchitekton/dan-mercede-substrate
          # Pinning to default branch (main); switch to a SHA pin when substrate
          # publishes versioned releases. dan-mercede-substrate is PRIVATE: access
          # is via a read-only, single-repo deploy key (Spec 4b D2) whose private
          # half lives in the SUBSTRATE_SSH_KEY actions secret.
          ref: main
          path: vendor/substrate
          ssh-key: ${{ secrets.SUBSTRATE_SSH_KEY }}
          persist-credentials: false
          fetch-depth: 1

      - name: Compile content
        id: compile
        env:
          # Points compileContent.ts at the substrate checkout above.
          SUBSTRATE_PATH: ${{ github.workspace }}/vendor/substrate
          # GitHub Actions ubuntu-latest runs in UTC. formatTimestamp/formatDate in
          # compileContent.ts use new Date().getHours()/getFullYear() (local-timezone
          # read) then append a hardcoded "PT" label. Without TZ pinned the published
          # bundle would show timestamps offset by 7-8 hours from source frontmatter.
          # Pin to PT here so generated timestamps match author intent.
          TZ: America/Los_Angeles
        run: |
          npm run compile

          if [ $? -ne 0 ]; then
            echo "::error::Compilation failed - validation errors"
            echo "compile_failed=true" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "compile_failed=false" >> $GITHUB_OUTPUT
      
      - name: Remove vendor/substrate before PR creation
        # The substrate checkout above places an external repo at vendor/substrate.
        # Without explicit removal, create-pull-request (which stages ALL modified
        # and untracked files by default) would include the embedded checkout as
        # either a gitlink or a bulk file tree in the PR. Strip it before PR
        # creation; the add-paths whitelists below provide defense in depth.
        run: rm -rf vendor/substrate

      - name: Create Pull Request (draft post)
        if: steps.find-raw.outputs.found == 'true' && steps.conductor.outputs.rejected != 'true' && steps.compile.outputs.compile_failed != 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: draft/${{ steps.parse.outputs.slug }}
          title: "Draft: ${{ steps.parse.outputs.title }}"
          body: |
            ## Draft Post

            **Type:** ${{ steps.parse.outputs.type }}
            **Slug:** `${{ steps.parse.outputs.slug }}`

            ---

            This PR was automatically generated from `/raw/${{ steps.find-raw.outputs.raw_file }}`.

            **Review the changes and use Slack to approve:**
            - Click **Approve** in `#danmercede-publishing` to merge and publish
            - Click **Needs Edit** to request changes
            - Click **Reject** to close this PR
          # Whitelist the only paths the draft-builder is allowed to mutate. Belt-and-
          # suspenders with the rm step above: even if a future change adds another
          # auxiliary checkout/tmp tree under the worktree, the PR stays scoped to
          # actual draft content.
          add-paths: |
            inbox/**
            constants.generated.ts
            public/posts.json
          labels: draft
          delete-branch: true

      - name: Create Pull Request (substrate sync)
        # Spec 4b D3/D8: when this run carries no admissible draft (no raw file,
        # or the conductor rejected it), pure substrate drift still ships. Fires
        # mutually exclusively with the draft PR above: the draft PR requires
        # found=true AND not-rejected; this one fires on the complement, so no run
        # opens two PRs proposing the same bundle.
        if: steps.find-raw.outputs.found != 'true' || steps.conductor.outputs.rejected == 'true'
        id: create-sync-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # STABLE branch (Spec 4b D8): no run-id suffix, so subsequent runs update
          # the same branch and PR in place instead of accumulating per-run PRs
          # that propose identical drift.
          branch: substrate-sync
          title: "Substrate sync: refresh content bundle"
          body: |
            ## Substrate sync

            No raw draft was admitted this run, but the compiled bundle picked up
            canonical drift from `dan-mercede-substrate` (Spec 4b D3/D8). This PR
            carries only the bundle artifacts compiled by CI from substrate
            canonicals targeting `danmercede.online` — review and merge to publish
            them to the live site.

            This branch is stable: later runs with further drift update this PR in
            place. No-drift runs do not open or touch a PR.
          # Sync PRs may mutate ONLY the compiled bundle artifacts. Narrower than
          # the draft whitelist on purpose: no inbox/ here — a sync run admits no
          # draft, so any inbox change showing up would be a bug worth surfacing.
          add-paths: |
            constants.generated.ts
            public/posts.json
          delete-branch: true

      - name: Post to Slack
        if: steps.create-pr.outputs.pull-request-number
        run: |
          PR_NUMBER="${{ steps.create-pr.outputs.pull-request-number }}"
          PR_URL="${{ steps.create-pr.outputs.pull-request-url }}"
          TITLE="${{ steps.parse.outputs.title }}"
          TYPE="${{ steps.parse.outputs.type }}"
          SLUG="${{ steps.parse.outputs.slug }}"
          
          # Build Slack Block Kit message with interactive buttons
          BLOCKS=$(jq -n \
            --arg title "$TITLE" \
            --arg pr_num "$PR_NUMBER" \
            --arg pr_url "$PR_URL" \
            --arg type "$TYPE" \
            --arg slug "$SLUG" \
            '[
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "Draft Ready for Review",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "fields": [
                  {"type": "mrkdwn", "text": ("*Title:*\n" + $title)},
                  {"type": "mrkdwn", "text": ("*Type:*\n" + $type)}
                ]
              },
              {
                "type": "section",
                "fields": [
                  {"type": "mrkdwn", "text": ("*PR:*\n<" + $pr_url + "|#" + $pr_num + ">")},
                  {"type": "mrkdwn", "text": ("*Slug:*\n`" + $slug + "`")}
                ]
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {"type": "plain_text", "text": "Approve", "emoji": true},
                    "style": "primary",
                    "action_id": "approve_post",
                    "value": $pr_num
                  },
                  {
                    "type": "button",
                    "text": {"type": "plain_text", "text": "Needs Edit", "emoji": true},
                    "action_id": "needs_edit_post",
                    "value": $pr_num
                  },
                  {
                    "type": "button",
                    "text": {"type": "plain_text", "text": "Reject", "emoji": true},
                    "style": "danger",
                    "action_id": "reject_post",
                    "value": $pr_num
                  }
                ]
              }
            ]')
          
          # Post to Slack using Bot Token
          curl -s -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"channel\": \"$SLACK_CHANNEL_ID\", \"blocks\": $BLOCKS, \"text\": \"Draft ready: $TITLE\"}"
      
      - name: Notify if no raw files
        if: steps.find-raw.outputs.found != 'true'
        run: |
          echo "No new raw files found. Workflow complete."
      
      - name: Notify if rejected
        if: steps.conductor.outputs.rejected == 'true'
        run: |
          # Post rejection notice to Slack
          curl -s -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"channel\": \"$SLACK_CHANNEL_ID\", \"text\": \"Draft rejected by Conductor for: ${{ steps.find-raw.outputs.raw_file }}\"}"
