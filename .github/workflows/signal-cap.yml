# Binding daily Pacific signal cap gate (REC-005).
#
# Runs on pull_request_target, so GitHub takes THIS file and the default
# checkout from the base branch: a PR cannot change the workflow or the guard
# that judges it. The PR head is fetched as git data only and is never checked
# out, installed, built or executed. The guard that runs is the base copy of
# tools/checkDailySignalCap.mjs, reading the PR by commit id (HEAD_SHA).
#
# Keep this file plain (block style, two-space indent, no anchors): its shape
# is enforced line by line in tests/signalCapWorkflow.test.mjs.
#
# The check only binds once `signal-cap` is a required status check on main.
name: signal-cap

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  signal-cap:
    name: signal-cap
    runs-on: ubuntu-latest
    steps:
      - name: Check out the base branch (never the PR)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node (no cache)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Fetch the PR head as data only
        run: |
          set -euo pipefail
          if ! printf '%s' "$PR_NUMBER" | grep -Eq '^[0-9]+$'; then
          echo "PR number is not a plain number" >&2
          exit 2
          fi
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          fetched="$(git rev-parse --verify 'refs/remotes/pr/head^{commit}')"
          if [ "$fetched" != "$EXPECTED_HEAD_SHA" ]; then
          echo "fetched PR head does not match the event head" >&2
          exit 2
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Daily Pacific signal cap guard (base copy)
        run: node tools/checkDailySignalCap.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
