name: Post-Publish Verification

on:
  pull_request:
    types: [closed]
    branches: [main]

env:
  SLACK_CHANNEL_ID: ${{ secrets.DANMERCEDE_CHANNEL_ID }}
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  # www, NOT the apex: the apex 301s to www with a literal "Redirecting..."
  # body, which silently broke every non-following curl in this job on its
  # first real run (2026-07-11). Fetches below also pass -L as a belt.
  SITE_URL: https://www.danmercede.online

jobs:
  verify-publish:
    # Fire on real publishes. The original 'published'-label gate was a silent
    # no-op: the signal-publish flow never labels its PRs, so every run since
    # the workflow landed concluded SKIPPED and no WebSub ping ever went out
    # (verified 2026-07-10: 20/20 runs skipped). Recognize the actual publish
    # shapes (signal titles / draft and signal branches); the label stays as a
    # manual override for anything else.
    if: >-
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'published') ||
       startsWith(github.event.pull_request.title, 'signal: ') ||
       startsWith(github.event.pull_request.head.ref, 'draft/') ||
       startsWith(github.event.pull_request.head.ref, 'codex/online-signal-'))
    runs-on: ubuntu-latest
    
    steps:
      - name: Extract slug from PR
        id: extract
        # Untrusted PR context reaches the shell ONLY via env (never templated
        # into the script body): a crafted title/branch stays data, not code
        # (estate prompt-defense: no untrusted GitHub context in run: blocks).
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # Extract slug from PR title "Draft: <title>" or branch name "draft/<slug>"
          # Try to get slug from branch name first. Signal publishes use
          # branch codex/online-signal-<slug> and title "signal: <slug>"
          # (the slug is already slug-form there; the generic title fallback
          # would wrongly prepend "signal-").
          if [[ "$PR_BRANCH" == draft/* ]]; then
            SLUG="${PR_BRANCH#draft/}"
          elif [[ "$PR_BRANCH" == codex/online-signal-* ]]; then
            SLUG="${PR_BRANCH#codex/online-signal-}"
          elif [[ "$PR_TITLE" == "signal: "* ]]; then
            SLUG="${PR_TITLE#signal: }"
          else
            # Fallback: derive from title
            TITLE=$(echo "$PR_TITLE" | sed 's/^Draft:\s*//')
            SLUG=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g')
          fi
          
          # Strip CR/LF before writing outputs: a multi-line title could
          # otherwise inject extra output records.
          SLUG=${SLUG//[$'\r\n']/ }
          TITLE_OUT=${PR_TITLE//[$'\r\n']/ }
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "title=$TITLE_OUT" >> $GITHUB_OUTPUT
      
      - name: Wait for the deploy to refresh posts.json (bounded)
        run: |
          # The fixed sleep could under-wait a slow Vercel build, making the
          # verification AND the WebSub ping read the PRE-deploy site
          # (backported from oia-web #74 review). Slug presence is NOT a
          # deploy signal for re-published slugs (pre-deploy posts.json
          # already matches), so poll the compile-stamped `generated`
          # timestamp, which every deploy bumps, with a baseline guard: an
          # empty baseline is never change-compared (a failed first fetch
          # would falsely read the next success as "deployed").
          BEFORE=""
          for i in 1 2 3 4 5 6; do
            BEFORE=$(curl -sL --max-time 15 "${SITE_URL}/posts.json" | jq -r '.generated // empty' 2>/dev/null || true)
            [ -n "$BEFORE" ] && break
            sleep 15
          done
          echo "pre-deploy generated: ${BEFORE:-<none>}"
          if [ -z "$BEFORE" ]; then
            echo "::warning::could not capture a pre-deploy baseline; falling back to a conservative 300s wait"
            sleep 300
            exit 0
          fi
          DEADLINE=$(( $(date +%s) + 480 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            sleep 30
            NOW=$(curl -sL --max-time 15 "${SITE_URL}/posts.json" | jq -r '.generated // empty' 2>/dev/null || true)
            if [ -n "$NOW" ] && [ "$NOW" != "$BEFORE" ]; then
              echo "deploy refreshed posts.json: $NOW"
              exit 0
            fi
          done
          echo "::warning::posts.json unchanged after 480s (slow deploy); verification below will report any miss"
      
      - name: Verify posts.json
        id: verify
        env:
          SLUG: ${{ steps.extract.outputs.slug }}
        run: |
          # Fetch posts.json. Every jq below is guarded: on its first real run
          # (2026-07-11) a non-JSON response crashed the unguarded count jq
          # under bash -e, which SKIPPED the WebSub ping and both notify steps,
          # so nobody was told verification failed. A bad fetch must degrade to
          # verified=false + the failure notification, never a silent crash.
          RESPONSE=$(curl -sL --max-time 15 "${SITE_URL}/posts.json" || echo "{}")

          # Check if slug exists in posts
          if echo "$RESPONSE" | jq -e --arg slug "$SLUG" '.posts[] | select(.slug == $slug)' > /dev/null 2>&1; then
            echo "verified=true" >> $GITHUB_OUTPUT
            echo "Slug '$SLUG' found in posts.json"
          else
            echo "verified=false" >> $GITHUB_OUTPUT
            echo "::warning::Slug '$SLUG' NOT found in posts.json"
          fi

          # Get post count. Guarded beyond parse errors: a misrouted endpoint
          # can return valid JSON whose .count is an object/array, which jq
          # would pretty-print over multiple lines and corrupt GITHUB_OUTPUT,
          # failing this step and skipping the success-gated notify steps.
          # Only a single-line numeric scalar may reach the output file.
          COUNT=$(echo "$RESPONSE" | jq -er 'if (.count | type) == "number" then .count else 0 end' 2>/dev/null || echo 0)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
      
      # WebSub freshness push (specs/rss-feed-spec.md scenario 4): tell the hub the
      # feeds changed so subscribers (Feedly-class readers) get pushed instead of
      # waiting on a poll. Non-blocking: a ping failure is a WARNING, never a gate.
      - name: Ping WebSub hub
        continue-on-error: true
        run: |
          for FEED in "https://www.danmercede.online/feed.xml" "https://www.danmercede.online/atom.xml"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://pubsubhubbub.appspot.com/" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "hub.mode=publish" \
              --data-urlencode "hub.url=${FEED}") || STATUS="000"
            if [ "$STATUS" = "204" ]; then
              echo "WebSub ping accepted for ${FEED}"
            else
              echo "::warning::WebSub ping for ${FEED} returned HTTP ${STATUS}"
            fi
          done

      - name: Notify success
        if: steps.verify.outputs.verified == 'true'
        env:
          SLUG: ${{ steps.extract.outputs.slug }}
          TITLE: ${{ steps.extract.outputs.title }}
          COUNT: ${{ steps.verify.outputs.count }}
        run: |
          # Build the payload with jq so title/slug stay data even if they
          # carry quotes or JSON metacharacters (no hand-spliced JSON).
          PAYLOAD=$(jq -n --arg channel "$SLACK_CHANNEL_ID" --arg title "$TITLE" \
            --arg count "$COUNT" --arg url "${SITE_URL}/#${SLUG}" '{
              channel: $channel,
              blocks: [{type: "section", text: {type: "mrkdwn",
                text: "*Published!* \($title)\n\n:white_check_mark: Verified in posts.json (total: \($count) posts)\n:link: <\($url)|View Post>"}}],
              text: "Published: \($title)"
            }')
          curl -s -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
      
      - name: Notify failure
        if: steps.verify.outputs.verified != 'true'
        env:
          SLUG: ${{ steps.extract.outputs.slug }}
          TITLE: ${{ steps.extract.outputs.title }}
        run: |
          PAYLOAD=$(jq -n --arg channel "$SLACK_CHANNEL_ID" --arg slug "$SLUG" \
            --arg title "$TITLE" '{
              channel: $channel,
              blocks: [{type: "section", text: {type: "mrkdwn",
                text: "*Verification Failed* :warning:\n\nPost `\($slug)` not found in posts.json after deployment.\n\n<https://vercel.com/orion-apex/danmercede-online|Check Vercel Dashboard>"}}],
              text: "Verification failed for: \($title)"
            }')
          curl -s -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
